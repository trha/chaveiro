[package]
name = "chaveiro-winui"
version = "0.1.0"
edition = "2024"
publish = false
description = "Chaveiro for Windows: winui-immediate over the chaveiro-core state machine"

[[bin]]
name = "chaveiro"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
chaveiro-core = { path = "../chaveiro-core" }
windows-collections = { version = "0.100.0", features = ["std"] }
windows-core = "0.100.0"
windows-future = "0.100.0"
windows-reference = { version = "0.100.0", features = ["std"] }
windows-strings = "0.100.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winui-executor = { path = "../winui-executor" }
winui-immediate = { path = "../winui-immediate" }
zeroize = "1"
zeroizing-alloc = "0.1.1"

[target.'cfg(windows)'.dev-dependencies]
proptest = "1"

[build-dependencies]
windows-bindgen = "0.100.0"
