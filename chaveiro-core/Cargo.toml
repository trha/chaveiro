[package]
name = "chaveiro-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
aes = "0.8"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
hkdf = "0.12"
hmac = "0.12"
icu_normalizer = "2"
p256 = { version = "0.13", default-features = false, features = ["alloc", "ecdsa", "pkcs8"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand_core = "0.6"
rsa = { version = "0.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", default-features = false, features = ["serde", "std"] }
sha1 = "0.10"
sha2 = "0.10"
ssh-encoding = { version = "0.2", default-features = false, features = ["alloc"] }
ssh-key ={ version = "0.6", default-features = false, features = ["alloc", "ecdsa", "ed25519", "encryption", "p256", "p384", "rand_core", "rsa"] }
zeroize = { version = "1", features = ["derive"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
expect-test = "1"
proptest = "1"
rand_chacha = "0.3"
