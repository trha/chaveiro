[package]
name = "winui-executor"
version = "0.1.0"
edition = "2024"
publish = false
description = "Runs !Send futures on the WinUI dispatcher of the current thread"

[target.'cfg(windows)'.dependencies]
futures-core = "0.3"
windows-core = "0.100.0"
windows-future = "0.100.0"
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
winui-immediate = { path = "../winui-immediate" }

[build-dependencies]
windows-bindgen = "0.100.0"
