[package]
name = "chaveiro-appkit"
version = "0.1.0"
edition = "2024"
publish = false
description = "Chaveiro for macOS: appkit-immediate over the chaveiro-core state machine"

[[bin]]
name = "chaveiro"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
appkit-executor = { path = "../appkit-executor" }
appkit-immediate = { path = "../appkit-immediate" }
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chaveiro-core = { path = "../chaveiro-core" }
zeroize = "1"
zeroizing-alloc = "0.1.1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = "0.3"
