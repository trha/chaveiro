[package]
name = "winui-spikes"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[target.'cfg(windows)'.dependencies]
rustc-hash = "2"
windows-collections = { version = "0.100.0", features = ["std"] }
windows-core = "0.100.0"
windows-future = "0.100.0"
windows-numerics = "0.100.0"
windows-reactor = "0.100.0"
windows-reference = { version = "0.100.0", features = ["std"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows-threading = "0.100.0"
windows-time = "0.100.0"
winui-immediate = { path = "../winui-immediate" }
