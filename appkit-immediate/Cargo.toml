[package]
name = "appkit-immediate"
version = "0.1.0"
edition = "2024"
publish = false
description = "An immediate-mode UI over the AppKit retained view tree"

[target.'cfg(target_os = "macos")'.dependencies]
ahash = "0.8"
block2 = "0.6"
zeroize = "1"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
proptest = "1"
